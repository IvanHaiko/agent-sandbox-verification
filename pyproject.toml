[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-agent-system"
version = "2.0.0"
description = "Restricted coding-agent workers for Codex and Claude Code: verified sandboxes and deterministic acceptance"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agent_system*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
