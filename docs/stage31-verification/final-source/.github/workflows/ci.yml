name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    # The database-backed tests are the only ones that can catch invalid SQL or
    # prove idempotency. Without a server here they would skip, and the suite
    # would report green for the wrong reason — so the server is provided and
    # REQUIRE_DB_TESTS turns a skip into a failure.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: steam_user
          POSTGRES_PASSWORD: steam_ci
          POSTGRES_DB: steam_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U steam_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: steam_user
      POSTGRES_PASSWORD: steam_ci
      POSTGRES_DB: steam_analytics
      REQUIRE_DB_TESTS: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Run tests
        run: pytest tests/
